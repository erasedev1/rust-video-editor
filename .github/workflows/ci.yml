name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on a new warning rather than letting them accumulate.
  RUSTDOCFLAGS: -D warnings

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ffmpeg

      - name: Install a software GPU
        run: |
          set -euxo pipefail
          # The rendering tests run against a real device and read pixels back.
          # Runners have no GPU, so Mesa's lavapipe stands in rather than the
          # tests being skipped — the shader and blend state still get covered.
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary | head -20

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Compiling on the other platforms catches portability breaks at the
      # commit that caused them, rather than at release time.
      - name: Build
        run: cargo build --workspace --all-targets
