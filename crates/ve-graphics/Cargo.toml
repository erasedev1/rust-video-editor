[package]
name = "ve-graphics"
description = "Shape and text rasterisation for the Verge video editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ve-core = { workspace = true }
log = { workspace = true }
tiny-skia = "0.12"
fontdb = { version = "0.24", default-features = false, features = ["fs", "memmap"] }
rustybuzz = "0.20"
ttf-parser = "0.25"

[dev-dependencies]
criterion = { workspace = true }
ve-time = { workspace = true }

[[bench]]
name = "raster"
harness = false
